name: Bot Worker CI

on:
  pull_request:
    paths:
      - 'bot-worker/**'
      - '.github/workflows/bot-worker-ci.yml'
  push:
    branches: [main]
    paths:
      - 'bot-worker/**'
      - '.github/workflows/bot-worker-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run check
      - run: npm test
