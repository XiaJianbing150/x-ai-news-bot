name: AI News Bot - Daily

on:
  schedule:
    # 北京时间 08:00 = UTC 00:00
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      hours_lookback:
        description: '回溯小时数 (默认 24)'
        required: false
        default: '24'

permissions:
  contents: read

jobs:
  send-morning-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOURS_LOOKBACK: ${{ inputs.hours_lookback || '24' }}
        run: python main.py
