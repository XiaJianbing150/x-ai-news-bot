name: AI News Bot - Daily

on:
  schedule:
    # 北京时间 07:00 = UTC 前一天 23:00
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      hours_lookback:
        description: '回溯小时数 (默认 168 = 7 天)'
        required: false
        default: '168'

permissions:
  contents: write   # 允许 commit & push archive/ 回 main

jobs:
  send-morning-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 取完整历史,push 不会因 shallow 拒绝
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOURS_LOOKBACK: ${{ inputs.hours_lookback || '168' }}
        run: python main.py

      - name: Commit archive
        if: always()  # 即便 bot 主流程失败,只要写过文件就尝试存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no archive changes to commit"
          else
            git commit -m "chore(archive): $(TZ=Asia/Shanghai date +%Y-%m-%d) AI 早报"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
